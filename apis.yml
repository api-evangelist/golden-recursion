aid: golden-recursion
name: Golden Recursion
description: >-
  Golden Recursion Inc. builds Golden, a San Francisco company using machine
  intelligence to construct a self-building knowledge graph of millions of
  connected entities — companies, people, venture-capital firms and products —
  each described by structured, cited properties. The Golden API v2 gives
  developers read-only, programmatic access to the same data that powers the
  Golden Query Tool: retrieve entities and their cited properties, pull the
  results of saved queries by ID or permalink, and introspect the entity-type
  and predicate schema. Responses are structured JSON with underlying source
  citations so every value can be traced. Authentication is a simple apikey
  header. Golden also published godel, an open-source Python SDK for its
  separate golden.xyz protocol GraphQL API. Backed by a16z ($59.5M raised);
  Golden was acquired by ComplyAdvantage on 2024-04-24 and golden.com now serves
  an acquisition notice, though the API v2 endpoints and the Scalar API
  reference at docs.golden.com remain live and were re-verified 2026-08-14.
