docs: https://docs.golden.com/
notes: >-
  Golden API v2 publishes NO numeric request-rate limit and returns NO
  rate-limit response headers. Two live probes of
  https://golden.com/api/v2/public/schema/entityTypes/ (anonymous, and with an
  invalid key) both returned HTTP 403 with an application/json DRF error and a
  header set carrying no X-RateLimit-*, no RateLimit-*, and no Retry-After —
  only allow, cache-control, vary and the Cloudflare edge headers. The only
  throttling signal the provider documents is the 429 `throttled` response
  declared on every operation in the OpenAPI, with no window, quota, or
  Retry-After contract attached. Consumption is instead metered commercially in
  monthly "data credits" per plan — see
  plans/golden-recursion-plans-pricing.yml. The one tier-dependent limit the
  spec states is the `pageSize` page cap.
