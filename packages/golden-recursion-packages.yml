notes: >-
  Golden Recursion's two first-party open-source libraries are godel (the Python
  SDK) and goldnlp (an NLP/NLU framework). BOTH ARE UNINSTALLABLE FROM PyPI AS OF
  2026-08-14: the project names are reserved on PyPI but the simple index returns
  `"files": []` and `"versions": []` for each, and https://pypi.org/pypi/<name>/json
  returns HTTP 404 — so `pip install godel` and `pip install goldnlp` both fail.
  The only distribution that exists is the GitHub source tree. Version and date
  below are therefore read from the git tag/release and the in-repo
  pyproject.toml rather than from a registry.
  Both libraries target the golden.xyz PROTOCOL GraphQL API, not the golden.com
  REST API v2 profiled in openapi/ — and golden.xyz no longer resolves (DNS
  failure on golden.xyz, docs.golden.xyz and dgraph.golden.xyz, probed
  2026-08-14), so the backend these SDKs wrap is gone. The REST Golden API v2
  ships no client library at all and is called directly over HTTPS with an
  `apikey` header.
  This is the abandonment picture: last godel release 2023-03-31, last commit on
  the default branch 2024-01-29, company acquired by ComplyAdvantage 2024-04-24.
