notes: >-
  Golden meters everything — the web app and the Golden API v2 alike — in "data
  credits". One credit is consumed per structured field requested or entity
  exported, and each tier carries a recurring monthly credit allowance that can
  be topped up without changing plan (https://golden.com/product/data-credits).
  Only the Enterprise tier names the API explicitly ("API at scale"); the
  published self-serve tiers do not state a separate API price, so an API
  consumer draws on the same monthly credit pool as the UI. The OpenAPI reflects
  the tier split in one place only: the `pageSize` parameter defaults to 2 on the
  Free plan and 10 on any paid plan (maximum 100).
  Read alongside rate-limits/golden-recursion-rate-limits.yml.
